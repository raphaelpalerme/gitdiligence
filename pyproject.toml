[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitdiligence"
version = "0.1.0"
description = "Agent IA de due diligence technique pour repos GitHub"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.86",
    "google-genai>=1.0",
    "httpx>=0.28",
    "pydantic>=2.12",
    "typer>=0.24.1",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
]

[project.scripts]
gitdiligence = "gitdiligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitdiligence"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
